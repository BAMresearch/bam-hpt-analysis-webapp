<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot Results</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .plot-container {
            text-align: center;
            margin: 20px 0;
        }
        .plot-image {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .plot-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="mt-3">Time Series Plot Results</h1>
        
        <div class="plot-info">
            <h5>Plot Information</h5>
            <p><strong>Selected Records:</strong> {{ selected_count }}</p>
            <p><strong>Variables Plotted:</strong> {{ plot_columns|join(', ') }}</p>
        </div>
        
        <div class="plot-container">
            <img src="data:image/png;base64,{{ plot_data }}" alt="Time Series Plot" class="plot-image">
        </div>
        
        <div class="text-center mt-4">
            <a href="{{ url_for('download_plot') }}" class="btn btn-success">
                <i class="fas fa-download"></i> Download Plot
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Back to Data Table
            </a>
            <a href="{{ url_for('cleanup_plot') }}" class="btn btn-warning">
                <i class="fas fa-trash"></i> Clean Up
            </a>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
